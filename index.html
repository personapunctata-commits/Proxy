<!DOCTYPE html>
<html>
<head>
    <title>Portal</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h2>Web Portal</h2>
    <input type="text" id="url" placeholder="https://example.com" style="width: 300px; padding: 8px;">
    <button onclick="go()" style="padding: 8px 15px;">Go</button>
    <script>
        function go() {
            let target = document.getElementById('url').value;
            if(!target.startsWith('http')) target = 'https://' + target;
            // Encodes the target URL to Base64 so the network filter can't read words like 'discord'
            let hiddenTarget = btoa(target);
            window.location.href = 'https://anonymouse.org/cgi-bin/anon-www.cgi/https://' + atob(hiddenTarget);
        }
    </script>
</body>
</html>
